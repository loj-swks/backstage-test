apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: agentic-service-template
  title: Agentic AI & RAG Service — New Repository
  description: Creates a brand-new repository for a production-ready agentic service (LangGraph/FastAPI) with optional RAG indexing (pgvector/Elasticsearch) and observability tracing, then registers it in the catalog.
  tags:
    - python
    - langgraph
    - ai-agent
    - rag
    - opentelemetry
    - new-repo
spec:
  owner: user:guest
  type: service

  # ------------------------------------------------------------------------
  # 1. User Input Form Steps
  # ------------------------------------------------------------------------
  parameters:
    - title: Basic Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name of the agentic microservice (kebab-case).
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Purpose of this agent service.
        owner:
          title: Owner
          type: string
          description: Team responsible for maintaining this service.
          ui:field: EntityPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        system:
          title: Parent System (Optional)
          type: string
          description: System or domain umbrella this agent belongs to.
          ui:field: EntityPicker
          ui:options:
            allowedKinds:
              - System

    - title: Architecture & Capabilities
      required:
        - architecture_style
        - vector_store
      properties:
        architecture_style:
          title: Agent Architecture Pattern
          type: string
          default: single-agent-rag
          enum:
            - single-agent-rag
            - multi-agent-supervisor
            - autonomous-tool-agent
          enumNames:
            - "Agentic RAG (Single Agent + Vector DB / Hybrid Search)"
            - "Multi-Agent Orchestrator (Supervisor + Subagent Mesh)"
            - "Autonomous Tool-Calling Agent (No RAG)"

        include_vector_search:
          title: Enable Vector & Hybrid Search Indexing
          type: boolean
          default: true
          description: Includes chunking pipelines, embedding clients, and vector store connectors.

        vector_store:
          title: Primary Vector / Search Backend
          type: string
          default: elasticsearch
          enum:
            - elasticsearch
            - pgvector
            - none
          enumNames:
            - "Elasticsearch (Hybrid Search)"
            - "PostgreSQL (pgvector / pg_trgm)"
            - "None (Pure Tool Calling / In-Memory)"

        enable_observability:
          title: Enable OpenTelemetry / LangSmith Tracing
          type: boolean
          default: true
          description: Pre-configures trace exporters and callbacks for AI observability.

    - title: New Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: The repository to create. It must not exist yet — use the "PR to Existing Repository" template for repositories that already exist.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        repoVisibility:
          title: Repository Visibility
          type: string
          default: private
          enum:
            - private
            - internal
            - public

  # ------------------------------------------------------------------------
  # 2. Scaffolder Execution Steps
  # ------------------------------------------------------------------------
  steps:
    - id: generate-files
      name: Generate Project Files
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          architecture_style: ${{ parameters.architecture_style }}
          include_vector_search: ${{ parameters.include_vector_search }}
          vector_store: ${{ parameters.vector_store }}
          enable_observability: ${{ parameters.enable_observability }}
          repoSlug: ${{ parameters.repoUrl | projectSlug }}

    - id: publish
      name: Create Repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: 'main'
        repoVisibility: ${{ parameters.repoVisibility }}
        # Metadata only — this repo is registered directly by the step below,
        # so it is intentionally left out of GitHub discovery's repository
        # filter (see catalog.providers.github in app-config.yaml).
        topics:
          - backstage-catalog
          - ai-agent

    # A brand-new repo has nothing to review, so register it immediately.
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  # ------------------------------------------------------------------------
  # 3. Output Links
  # ------------------------------------------------------------------------
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
