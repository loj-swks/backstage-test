apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.repoSlug }}
    ai.backstage.io/mcp-transport: ${{ values.transportType }}
  tags:
    - mcp
    - tools
    - ai
spec:
  type: service
  owner: ${{ values.owner }}
  lifecycle: experimental
