apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ai-observability-tracing-template
  title: AI Observability & Telemetry Service
  description: Configures OpenTelemetry exporters, token cost tracking, latency reporting, and tracing bridges for AI applications.
  tags:
    - ai
    - observability
    - tracing
    - opentelemetry
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Observability Setup
      required:
        - name
        - owner
        - telemetryTarget
      properties:
        name:
          title: Service Name
          type: string
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group, User]
        telemetryTarget:
          title: Telemetry Collector
          type: string
          default: langsmith-self-hosted
          enum: [langsmith-self-hosted, open-telemetry, arize-phoenix]
          enumNames:
            - Self-Hosted LangSmith
            - OpenTelemetry Collector (Prometheus/Jaeger)
            - Arize Phoenix

    - title: Target Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]

  steps:
    - id: template
      name: Generate Telemetry Module
      action: fetch:template
      input:
        url: ./template
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          telemetryTarget: ${{ parameters.telemetryTarget }}

    - id: publish
      name: Publish Repository
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}